services:
  redis:
    image: redis:7-alpine
    container_name: kokoroya-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    networks:
      - kokoroya

volumes:
  redis_data:

networks:
  kokoroya:
    driver: bridge
